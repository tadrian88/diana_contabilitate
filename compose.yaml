services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diana
      POSTGRES_USER: diana
      POSTGRES_PASSWORD: diana
      TZ: UTC
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diana -d diana"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - diana-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - diana-redis:/data

  migrate:
    image: arigaio/atlas:0.36.0
    env_file: .env.local
    working_dir: /schema
    volumes:
      - ./backend/atlas.hcl:/schema/atlas.hcl:ro
      - ./backend/migrations:/schema/migrations:ro
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env.local
    command: ["api"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 35s

  worker:
    build: ./backend
    env_file: .env.local
    command: ["worker"]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 35s

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./tsconfig.node.json:/app/tsconfig.node.json:ro
      - frontend-modules:/app/node_modules
    environment:
      VITE_BACKEND_READS_ENABLED: "true"
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_ENVIRONMENT_LABEL: LOCAL
    command: ["sh", "-c", "npm ci --cache /tmp/npm-cache && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  diana-postgres:
  diana-redis:
  frontend-modules:
